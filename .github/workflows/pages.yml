name: 发布到 GitHub Pages

# 每次推送 main 就把站点导出成静态目录并发布。站点本身是 FastAPI 应用，Pages
# 只能托管文件，所以发布的是 scripts/export_site.py 的产物：封面、课程库、关于、
# 404 和每门课的静态包。后台、进度同步、视频生成不在这份产物里（见 README
# 「发布到 GitHub Pages」）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 构建静态站点
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # Pages 没启用时在这里直接失败，不用等构建跑完。
      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: 安装固定的播放器运行时
        run: npm ci --prefix tools

      - name: 同步播放器、字体子集与设计令牌
        run: python scripts/sync_runtime.py

      - name: 质量门（静态检查与测试）
        run: |
          ruff check .
          python -m pytest -m "not e2e"

      - name: 计算发布地址
        id: site
        env:
          # 自定义域名或换路径时，在仓库 Settings → Variables 里覆盖：
          #   SITE_URL=https://learn.example.com   SITE_BASE_PATH=/   （根路径）
          #   SITE_URL=https://example.com/mirror  SITE_BASE_PATH=/mirror
          SITE_URL_OVERRIDE: ${{ vars.SITE_URL }}
          BASE_PATH_OVERRIDE: ${{ vars.SITE_BASE_PATH }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          repo_key="$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')"
          url="${SITE_URL_OVERRIDE:-https://$owner.github.io}"
          if [ -n "${BASE_PATH_OVERRIDE:-}" ]; then
            base="$BASE_PATH_OVERRIDE"
          elif [ "$repo_key" = "$owner.github.io" ]; then
            base=""
          else
            base="/$repo"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "站点地址：${url%/}$base/"

      - name: 导出静态站点
        env:
          PROJECT_URL_OVERRIDE: ${{ vars.PROJECT_URL }}
        run: |
          set -euo pipefail
          args=(--site-url "${{ steps.site.outputs.url }}" --base-path "${{ steps.site.outputs.base }}")
          if [ -n "${PROJECT_URL_OVERRIDE:-}" ]; then
            args+=(--project-url "$PROJECT_URL_OVERRIDE")
          fi
          python scripts/export_site.py "${args[@]}"

      - name: 冒烟检查（普通静态服务器，不启动 FastAPI）
        run: |
          set -euo pipefail
          python -m http.server 8090 --directory dist/site &
          server=$!
          trap 'kill $server' EXIT
          python - <<'PY'
          import time
          import urllib.request

          base = "http://127.0.0.1:8090"


          def fetch(path: str) -> str:
              last_error: Exception | None = None
              for _ in range(40):
                  try:
                      with urllib.request.urlopen(base + path, timeout=2) as response:
                          return response.read().decode("utf-8")
                  except Exception as error:  # noqa: BLE001 - retry until the server is up
                      last_error = error
                      time.sleep(0.25)
              raise SystemExit(f"{path} 打不开：{last_error}")


          for path in ("/", "/courses/", "/about/"):
              body = fetch(path)
              if "页间课堂" not in body:
                  raise SystemExit(f"{path} 没有返回站点页面")
              print(f"ok {path}")
          PY

      - name: 上传发布产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
          retention-days: 1

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
