                <p id="s-stateless-notebook-cap-0" class="cap-line clip" data-start="0.7" data-duration="5.52">先问一个你肯定遇到过的问题：你换一个模型，对话还能接着聊；</p>
        <p id="s-stateless-notebook-cap-1" class="cap-line clip" data-start="6.26" data-duration="5.137">网断了重连，记录还在；第二天打开，它还记得昨天聊到哪。</p>
        <p id="s-stateless-notebook-cap-2" class="cap-line clip" data-start="11.397" data-duration="3.113">可大模型的 API，默认是「不记得你」的。</p>
        <p id="s-stateless-notebook-cap-3" class="cap-line clip" data-start="14.55" data-duration="2.835">那这些记忆，到底存在哪？</p>
        <p id="s-stateless-notebook-cap-4" class="cap-line clip" data-start="17.425" data-duration="3.447">你可以把大模型想成一个黑屋里的专家。</p>
        <p id="s-stateless-notebook-cap-5" class="cap-line clip" data-start="20.912" data-duration="4.66">屋子很小，只有一张桌子、一盏灯、一个窗口。</p>
        <p id="s-stateless-notebook-cap-6" class="cap-line clip" data-start="25.612" data-duration="4.148">专家非常聪明，但他不认人，只认笔记本。</p>
        <p id="s-stateless-notebook-cap-7" class="cap-line clip" data-start="29.8" data-duration="4.047">门外排着成千上万的人，每人手里一本笔记本。</p>
        <p id="s-stateless-notebook-cap-8" class="cap-line clip" data-start="33.887" data-duration="2.948">每一本笔记本，就是一次会话。</p>
        <p id="s-stateless-notebook-cap-9" class="cap-line clip" data-start="36.875" data-duration="6.147">第一页是 Harness 写的系统提示词：你是谁、能做什么、不能做什么。</p>
        <p id="s-stateless-notebook-cap-10" class="cap-line clip" data-start="43.062" data-duration="4.81">后面是你们聊过的每一句话，中间还夹着工具返回的结果。</p>
        <p id="s-stateless-notebook-cap-11" class="cap-line clip" data-start="47.912" data-duration="5.24">专家每次拿到本子，都从第一页开始读，一直读到最后一页，</p>
        <p id="s-stateless-notebook-cap-12" class="cap-line clip" data-start="53.192" data-duration="3.48">然后在下一页写下答案，合上，递出去。</p>
