                <p id="s-secrets-cap-0" class="cap-line clip" data-start="0.7" data-duration="1.847">最后必须讲安全。</p>
        <p id="s-secrets-cap-1" class="cap-line clip" data-start="2.547" data-duration="5.338">这一页是给所有新手的：有些东西，绝对不能交给 Agent。</p>
        <p id="s-secrets-cap-2" class="cap-line clip" data-start="7.925" data-duration="5.435">你要先建立一个概念：Agent 不是一个只在你电脑里自说自话的程序。</p>
        <p id="s-secrets-cap-3" class="cap-line clip" data-start="13.4" data-duration="5.954">你发给它的每一段文字，都会进入上下文，然后被发到模型服务商那里；</p>
        <p id="s-secrets-cap-4" class="cap-line clip" data-start="19.394" data-duration="5.766">它可能被记录、被缓存，也可能经过你安装的插件、技能、MCP 服务。</p>
        <p id="s-secrets-cap-5" class="cap-line clip" data-start="25.2" data-duration="4.51">也就是说，你贴进去的东西，是可能「发到外面」的。</p>
        <p id="s-secrets-cap-6" class="cap-line clip" data-start="29.75" data-duration="3.982">所以，这几类信息不要给：密码、验证码；</p>
        <p id="s-secrets-cap-7" class="cap-line clip" data-start="33.772" data-duration="3.347">大模型的 API key、云服务的密钥；</p>
        <p id="s-secrets-cap-8" class="cap-line clip" data-start="37.159" data-duration="3.982">身份证、银行卡、住址这些个人敏感信息；</p>
        <p id="s-secrets-cap-9" class="cap-line clip" data-start="41.181" data-duration="4.829">公司的机密文档、未公开的代码；还有客户的数据。</p>
        <p id="s-secrets-cap-10" class="cap-line clip" data-start="46.05" data-duration="4.289">尤其是 API key——它不是一句话，它是一把钥匙，</p>
        <p id="s-secrets-cap-11" class="cap-line clip" data-start="50.379" data-duration="3.306">别人拿到就能花你的钱、用你的额度。</p>
        <p id="s-secrets-cap-12" class="cap-line clip" data-start="53.725" data-duration="5.91">把 key 写进对话、写进 agents.md、写进 skill，都等于把它交出去。</p>
        <p id="s-secrets-cap-13" class="cap-line clip" data-start="59.675" data-duration="5.325">正确的做法是：密钥放环境变量或密钥管理器，让程序去读，</p>
        <p id="s-secrets-cap-14" class="cap-line clip" data-start="65.04" data-duration="5.921">不要出现在提示词里；确实需要 AI 处理敏感数据，先脱敏、裁剪，</p>
        <p id="s-secrets-cap-15" class="cap-line clip" data-start="71" data-duration="5.722">只给它必要的那一部分；给它最小权限，能只读就不要给写权限。</p>
        <p id="s-secrets-cap-16" class="cap-line clip" data-start="76.762" data-duration="3.873">记住一句话：能不给的，就不给。</p>
      </div>
      <div class="cap-foot">
        <span class="cap-code">S27</span>
        <span class="cap-clock">01:22</span>
      </div>
    </footer>
