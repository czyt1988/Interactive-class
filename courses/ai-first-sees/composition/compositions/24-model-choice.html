    <footer class="cap-band">
      <div class="cap-lines">
                <p id="s-model-choice-cap-0" class="cap-line clip" data-start="0.7" data-duration="4.022">这里补充一个容易被忽略的技巧：选对模型。</p>
        <p id="s-model-choice-cap-1" class="cap-line clip" data-start="4.722" data-duration="4.75">任务开始的时候，先确认这个模型适不适合你的任务。</p>
        <p id="s-model-choice-cap-2" class="cap-line clip" data-start="9.512" data-duration="4.91">现在的模型很多，但无非两类：多模态，和非多模态。</p>
        <p id="s-model-choice-cap-3" class="cap-line clip" data-start="14.462" data-duration="6.06">多模态可以识别图片，甚至能解读视频；非多模态只能处理文字。</p>
        <p id="s-model-choice-cap-4" class="cap-line clip" data-start="20.562" data-duration="4.824">如果你要做一套精美的 PPT，或者需要它解读图片、看设计稿，</p>
        <p id="s-model-choice-cap-5" class="cap-line clip" data-start="25.426" data-duration="1.871">就一定要选多模态模型。</p>
        <p id="s-model-choice-cap-6" class="cap-line clip" data-start="27.337" data-duration="4.343">因为现在能力强的 Agent 做完 PPT 会自己截图，</p>
        <p id="s-model-choice-cap-7" class="cap-line clip" data-start="31.72" data-duration="5.14">让视觉模型检查有没有元素干涉、文字和图片有没有重叠。</p>
        <p id="s-model-choice-cap-8" class="cap-line clip" data-start="36.9" data-duration="4.086">你选一个非多模态模型，就算他的编程能力比较强，</p>
        <p id="s-model-choice-cap-9" class="cap-line clip" data-start="41.026" data-duration="4.893">但是他无法检查做完的这个 PPT 在视觉上是否好看或者有干涉</p>
        <p id="s-model-choice-cap-10" class="cap-line clip" data-start="45.959" data-duration="2.113">，他只能通过代码来评估。</p>
        <p id="s-model-choice-cap-11" class="cap-line clip" data-start="48.112" data-duration="6.96">国产这边，DeepSeek-V4.1 flash、千问 3.8 Max、GLM-5.3-Flash 都是多</p>
