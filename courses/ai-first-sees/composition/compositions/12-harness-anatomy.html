                <p id="s-harness-anatomy-cap-0" class="cap-line clip" data-start="0.7" data-duration="3.336">把 Harness 看成一个员工的工位。</p>
        <p id="s-harness-anatomy-cap-1" class="cap-line clip" data-start="4.036" data-duration="7.409">工具，是纸、笔、电脑、打印机、键盘这些设备，是员工干活的工具；</p>
        <p id="s-harness-anatomy-cap-2" class="cap-line clip" data-start="11.485" data-duration="6.456">Skill，是岗位 SOP 和作业手册，告诉他每件事的标准流程；</p>
        <p id="s-harness-anatomy-cap-3" class="cap-line clip" data-start="17.981" data-duration="7.298">MCP，是跨部门的系统接口，让他能和财务、业务所有体系打通协作；</p>
        <p id="s-harness-anatomy-cap-4" class="cap-line clip" data-start="25.319" data-duration="6.817">行动循环，就是「接需求 - 处理 - 交付 - 反馈」的工作闭环，</p>
        <p id="s-harness-anatomy-cap-5" class="cap-line clip" data-start="32.176" data-duration="2.366">是他持续运转的节奏。</p>
        <p id="s-harness-anatomy-cap-6" class="cap-line clip" data-start="34.582" data-duration="4.432">上下文是工作日志和档案，决定他「记得什么」；</p>
        <p id="s-harness-anatomy-cap-7" class="cap-line clip" data-start="39.054" data-duration="4.635">权限是岗位权责和审批等级，决定他「能碰什么」。</p>
        <p id="s-harness-anatomy-cap-8" class="cap-line clip" data-start="43.729" data-duration="5.004">四件加两层，就是 Harness 的完整组成。</p>
        <p id="s-harness-anatomy-cap-9" class="cap-line clip" data-start="48.773" data-duration="4.326">而真正办公的人，就是 Harness 对接的大脑；</p>
        <p id="s-harness-anatomy-cap-10" class="cap-line clip" data-start="53.139" data-duration="6.988">这个工位可以有不同智力的员工入座：聪明的员工相当于能力更强的模型，</p>
        <p id="s-harness-anatomy-cap-11" class="cap-line clip" data-start="60.167" data-duration="4.007">不聪明的员工相当于能力相对较弱的模型。</p>
        <p id="s-harness-anatomy-cap-12" class="cap-line clip" data-start="64.214" data-duration="4.127">他们都可以在这个工位里干活，干活的好坏，</p>
        <p id="s-harness-anatomy-cap-13" class="cap-line clip" data-start="68.381" data-duration="4.543">取决于员工的聪明程度，也就是模型的能力强弱。</p>
        <p id="s-harness-anatomy-cap-14" class="cap-line clip" data-start="72.964" data-duration="3.668">其实 harness 是一个工程学问题，</p>
        <p id="s-harness-anatomy-cap-15" class="cap-line clip" data-start="76.672" data-duration="4.266">目前各大厂家提供的工位能力都差不多，</p>
        <p id="s-harness-anatomy-cap-16" class="cap-line clip" data-start="80.978" data-duration="5.343">而决定 harness 强弱的是这个工作流程及工作准则</p>
      </div>

        <span class="cap-progress" aria-hidden="true"><i id="s-harness-anatomy-progress"></i></span>

      </div>
