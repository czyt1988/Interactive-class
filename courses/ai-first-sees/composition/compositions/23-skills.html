        <p id="s-skills-cap-13" class="cap-line clip" data-start="56.362" data-duration="5.214">但模型能力上来之后，执行 Agent 任务基本不需要这种约束了，</p>

        <p id="s-skills-cap-17" class="cap-line clip" data-start="71.237" data-duration="4.048">我现在在编程上唯一保留的技能，是 grill me。</p>
