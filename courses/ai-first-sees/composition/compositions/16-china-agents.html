                <p id="s-china-agents-cap-0" class="cap-line clip" data-start="0.7" data-duration="2.11">国内也不缺 Agent。</p>
        <p id="s-china-agents-cap-1" class="cap-line clip" data-start="2.81" data-duration="4.526">2025 年 3 月，字节的 Trae 发布国内版，走 IDE 路线；</p>
        <p id="s-china-agents-cap-2" class="cap-line clip" data-start="7.376" data-duration="4.446">7 月，阿里的 Qwen Code 跟着 Qwen3-Coder 一起开源；</p>
        <p id="s-china-agents-cap-3" class="cap-line clip" data-start="11.862" data-duration="4.267">8 月，阿里又发布 Qoder，一个独立的 Agentic IDE；</p>
        <p id="s-china-agents-cap-4" class="cap-line clip" data-start="16.168" data-duration="2.382">智谱的 ZCode 走长任务路线；</p>
        <p id="s-china-agents-cap-5" class="cap-line clip" data-start="18.591" data-duration="3.818">2026 年 3 月，腾讯把 CodeBuddy 和办公能力，</p>
        <p id="s-china-agents-cap-6" class="cap-line clip" data-start="22.449" data-duration="5.702">一起收进 WorkBuddy 一个主入口；5 月，月之暗面的 Kimi Code 开源；</p>
        <p id="s-china-agents-cap-7" class="cap-line clip" data-start="28.191" data-duration="3.369">8 月，DeepSeek 发布 DeepSeek Harness。</p>
        <p id="s-china-agents-cap-8" class="cap-line clip" data-start="31.6" data-duration="2.283">这些我大多用过一段时间；</p>
        <p id="s-china-agents-cap-9" class="cap-line clip" data-start="33.923" data-duration="4.702">我的体验是：国内团队在模型和 Agent 上都跟得很紧，</p>
        <p id="s-china-agents-cap-10" class="cap-line clip" data-start="38.665" data-duration="2.67">而且今年开始把入口收成一个。</p>
        <p id="s-china-agents-cap-11" class="cap-line clip" data-start="41.375" data-duration="4.451">DeepSeek Harness 在 2026 年 8 月发布 v0.1，</p>
        <p id="s-china-agents-cap-12" class="cap-line clip" data-start="45.866" data-duration="3.719">9 月底出桌面端，11 月初日活 154 万。</p>
        <p id="s-china-agents-cap-13" class="cap-line clip" data-start="49.625" data-duration="5.973">它比较特别的地方不在模型，而在架构：基于 Cordis 插件运行时，</p>
        <p id="s-china-agents-cap-14" class="cap-line clip" data-start="55.638" data-duration="5.472">模型、工具、Skill、会话、沙箱、Agent Loop，全都是插件。</p>
        <p id="s-china-agents-cap-15" class="cap-line clip" data-start="61.15" data-duration="2.747">连「循环」本身都可以被替换。</p>
        <p id="s-china-agents-cap-16" class="cap-line clip" data-start="63.937" data-duration="3.767">这意味着，你可以让 Harness 改变自己的功能，</p>
        <p id="s-china-agents-cap-17" class="cap-line clip" data-start="67.744" data-duration="2.616">这是一种比较新的软件设计思路。</p>
        <p id="s-china-agents-cap-18" class="cap-line clip" data-start="70.4" data-duration="3.308">软件的界面想要怎样，是由你说了算，</p>
        <p id="s-china-agents-cap-19" class="cap-line clip" data-start="73.748" data-duration="3.505">而不是官方给你设计好你就继续这样用，</p>
        <p id="s-china-agents-cap-20" class="cap-line clip" data-start="77.292" data-duration="3.505">你完全可以让它自己改成你想要的样子。</p>
        <p id="s-china-agents-cap-21" class="cap-line clip" data-start="80.837" data-duration="3.198">它是一套可以自己生长的 Harness。</p>
        <p id="s-china-agents-cap-22" class="cap-line clip" data-start="84.075" data-duration="5.572">群雄看完了，接下来最实际的问题：这些 Agent 到底该怎么用？</p>
