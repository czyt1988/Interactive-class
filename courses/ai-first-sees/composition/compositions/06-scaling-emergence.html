      <div class="cap-lines">
                <p id="s-scaling-emergence-cap-0" class="cap-line clip" data-start="0.7" data-duration="5.924">大语言模型不是 2022 年才发明的，学界研究了很多年。</p>
        <p id="s-scaling-emergence-cap-1" class="cap-line clip" data-start="6.624" data-duration="6.686">2019 年，OpenAI 放出 GPT-2，15 亿参数。</p>
        <p id="s-scaling-emergence-cap-2" class="cap-line clip" data-start="13.35" data-duration="5.558">它写出来的文字已经很像人了，但当时并没有引起太多的关注，</p>
        <p id="s-scaling-emergence-cap-3" class="cap-line clip" data-start="18.948" data-duration="4.759">因为他的能力还不够出众，无法满足我们日常的工作。</p>
        <p id="s-scaling-emergence-cap-4" class="cap-line clip" data-start="23.747" data-duration="8.562">2020 年，GPT-3 来了，1750 亿参数，任务还是同一个：猜下一个词。</p>
        <p id="s-scaling-emergence-cap-5" class="cap-line clip" data-start="32.349" data-duration="4.994">OpenAI 发现，模型越大、数据越多、算力越多，</p>
        <p id="s-scaling-emergence-cap-6" class="cap-line clip" data-start="37.383" data-duration="3.941">能力会按一条相当稳定的曲线往上走。</p>
        <p id="s-scaling-emergence-cap-7" class="cap-line clip" data-start="41.364" data-duration="3.681">这就是 scaling law，规模定律。</p>
        <p id="s-scaling-emergence-cap-8" class="cap-line clip" data-start="45.085" data-duration="3.445">直白的说就是「大力出奇迹」。</p>
        <p id="s-scaling-emergence-cap-9" class="cap-line clip" data-start="48.57" data-duration="3.71">真正让人意外的，是另一件事。</p>
        <p id="s-scaling-emergence-cap-10" class="cap-line clip" data-start="52.32" data-duration="4.652">GPT-3 的论文里有一组多位数加法的实验：</p>
        <p id="s-scaling-emergence-cap-11" class="cap-line clip" data-start="57.012" data-duration="3.787">从 1.25 亿到 130 亿参数的模型，</p>
        <p id="s-scaling-emergence-cap-12" class="cap-line clip" data-start="60.839" data-duration="5.269">三位数加法基本都在 10% 以下，跟瞎猜差不多；</p>
        <p id="s-scaling-emergence-cap-13" class="cap-line clip" data-start="66.148" data-duration="6.997">可一跨过 130 亿这个门槛，到 1750 亿，准确率一下跳到 80%。</p>
        <p id="s-scaling-emergence-cap-14" class="cap-line clip" data-start="73.185" data-duration="7.96">两位数加法更明显：130 亿那一档只能对一半，1750 亿接近全对。</p>
        <p id="s-scaling-emergence-cap-15" class="cap-line clip" data-start="81.185" data-duration="5.18">不是慢慢变好，是在某个门槛上，突然就会了。</p>
        <p id="s-scaling-emergence-cap-16" class="cap-line clip" data-start="86.405" data-duration="4.466">2022 年，有研究把这个现象命名为「涌现能力」，</p>
        <p id="s-scaling-emergence-cap-17" class="cap-line clip" data-start="90.911" data-duration="5.167">Emergent Abilities：有些能力，在小模型上根本看不到，</p>
        <p id="s-scaling-emergence-cap-18" class="cap-line clip" data-start="96.118" data-duration="3.365">模型大到一定程度，它突然就出现了。</p>
        <p id="s-scaling-emergence-cap-19" class="cap-line clip" data-start="99.523" data-duration="3.769">用一句话说，就是量变引起质变。</p>
        <p id="s-scaling-emergence-cap-20" class="cap-line clip" data-start="103.332" data-duration="6.017">这也是为什么，GPT-2 时代大家没感觉，GPT-3 之后，</p>
        <p id="s-scaling-emergence-cap-21" class="cap-line clip" data-start="109.389" data-duration="4.756">很多人觉得：大语言模型的智商非常的高。</p>
        <p id="s-scaling-emergence-cap-22" class="cap-line clip" data-start="114.185" data-duration="4.063">大语言模型不是 OpenAI 一家的独角戏。</p>
        <p id="s-scaling-emergence-cap-23" class="cap-line clip" data-start="118.288" data-duration="4.234">2017 年，谷歌的 Transformer 铺好了路；</p>
        <p id="s-scaling-emergence-cap-24" class="cap-line clip" data-start="122.562" data-duration="3.784">2018 年，BERT 证明了预训练的力量；</p>
        <p id="s-scaling-emergence-cap-25" class="cap-line clip" data-start="126.386" data-duration="4.909">2021 年，国内的悟道 2.0 进了万亿参数俱乐部；</p>
        <p id="s-scaling-emergence-cap-26" class="cap-line clip" data-start="131.334" data-duration="5.246">2023 年，文心一言、通义千问、ChatGLM 接连发布；</p>
        <p id="s-scaling-emergence-cap-27" class="cap-line clip" data-start="136.62" data-duration="2.772">后面还有 DeepSeek、Kimi。</p>
      </div>
