      <div class="cap-lines">
                <p id="s-cnn-cap-0" class="cap-line clip" data-start="0.7" data-duration="4.896">10 年前，AI 主要的能力是它「看」的本事，</p>
        <p id="s-cnn-cap-1" class="cap-line clip" data-start="5.636" data-duration="4.032">这个能力来自于卷积神经网络，CNN。</p>
        <p id="s-cnn-cap-2" class="cap-line clip" data-start="9.668" data-duration="4.885">你可以把它想成一层一层的滤镜：第一层看边缘，</p>
        <p id="s-cnn-cap-3" class="cap-line clip" data-start="14.593" data-duration="5.569">第二层看形状，第三层看眼睛、耳朵，最后拼成一只猫。</p>
