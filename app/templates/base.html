<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f4efe6" />
    <title>{% block title %}{{ site.title }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}" />
    {% if canonical %}<link rel="canonical" href="{{ canonical }}" />{% endif %}
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}" />
    <meta property="og:description" content="{% block og_description %}{{ self.description() }}{% endblock %}" />
    {% if canonical %}<meta property="og:url" content="{{ canonical }}" />{% endif %}
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="{{ site.link('/static/favicon.svg') }}" type="image/svg+xml" />
    <link rel="stylesheet" href="{{ site.link('/static/tokens.css') }}" />
    <link rel="stylesheet" href="{{ site.link('/static/site.css') }}" />
    {% block head_extra %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">跳到正文</a>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="wordmark" href="{{ site.link('/') }}" aria-label="页间课堂 首页">
          <span class="wordmark__mark" aria-hidden="true">页间</span>
          <span class="wordmark__text">课堂</span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="{{ site.link('/courses') }}" {% if page == "library" %}aria-current="page"{% endif %}>课程库</a>
          <a href="{{ site.link('/about') }}" {% if page == "about" %}aria-current="page"{% endif %}>关于</a>
          {% if page == "home" and site.admin %}
            <a class="site-nav__admin" href="{{ site.link('/admin') }}">后台管理</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main id="main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <p class="site-footer__note">
          <strong>{{ site.title }}</strong> · 一页一页讲，随时可以停。
        </p>
        <p class="site-footer__meta">
          交互视频课，无 CDN，可键盘操作，每屏都有讲义
          {% if site.admin %}<a class="site-footer__admin" href="{{ site.link('/admin') }}">后台设置</a>{% endif %}
        </p>
      </div>
    </footer>
    <script src="{{ site.link('/static/site.js') }}" defer></script>
  </body>
</html>
