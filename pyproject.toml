[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning"
version = "0.1.0"
description = "A web-animation course platform for learning AI, one screen at a time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
  "playwright>=1.45,<2",
  "pytest-playwright>=0.5,<1",
  "fonttools[woff]>=4.53,<5",
  "brotli>=1.1,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "e2e: browser-level tests that need Chromium",
]
filterwarnings = [
  "error::DeprecationWarning:app.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions", "tools", "dist", "courses", ".tmp", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
